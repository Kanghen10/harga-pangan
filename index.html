<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Harga Pangan Rata-Rata di JAWA BARAT</title>
  <style>
    :root{
      --bg:#f7f7f8;
      --card:#ffffff;
      --muted:#6b6b6b;
      --title:#111;
      --accent:#0a84ff;
      --radius:14px;
    }

    html,body{
      height:100%;
      margin:0;
      background:var(--bg);
      font-family: Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .wrap{
      max-width:980px;
      margin:18px auto;
      padding:18px;
    }

    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:10px;
    }

    h1{
      margin:0;
      font-size:22px;
      color:var(--title);
      letter-spacing: -0.3px;
    }

    .meta{
      color:var(--muted);
      font-size:13px;
    }

    /* grid */
    .grid{
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      gap:14px;
    }

    @media (max-width:700px){
      .grid{ grid-template-columns: 1fr; }
    }

    .card{
      background:var(--card);
      border-radius:var(--radius);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.03), 0 6px 18px rgba(12,12,14,0.06);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height:220px;
    }

    .card .imgwrap{
      height:150px;
      overflow:hidden;
      background:linear-gradient(180deg, #f3f3f3, #efefef);
      border-bottom: 1px solid rgba(0,0,0,0.04);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .card img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      border-radius:0;
    }

    .card-body{
      padding:16px;
      display:flex;
      flex-direction:column;
      gap:8px;
      flex:1;
    }

    .title{
      font-size:20px;
      margin:0;
      color:var(--title);
      line-height:1.05;
      font-weight:700;
    }

    .price-row{
      display:flex;
      align-items:center;
      gap:10px;
      margin-top:4px;
    }

    .price{
      font-size:18px;
      font-weight:800;
      color:#222;
    }

    .unit{
      color:var(--muted);
      font-weight:600;
      font-size:15px;
    }

    .indicator{
      display:inline-flex;
      align-items:center;
      gap:6px;
      font-size:13px;
      font-weight:700;
    }

    /* small arrow icons */
    .arrow-up svg, .arrow-down svg, .arrow-same svg {
      width:16px;
      height:16px;
      display:block;
    }

    .arrow-up { color:#059669; } /* green */
    .arrow-down { color:#e11d48; } /* red */
    .arrow-same { color:#9ca3af; } /* gray */

    .footer-note{
      text-align:center;
      margin-top:20px;
      color:var(--muted);
      font-size:13px;
      line-height:1.4;
    }

    #pagination-controls button {
      padding: 6px 14px;
      margin: 0 5px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    #pagination-controls button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Harga Pangan Rata-Rata di JAWA BARAT</h1>
        <div class="meta" id="last-update">Memuat data...</div>
      </div>
      <div style="text-align:right;">
        <div class="meta"></div>
      </div>
    </header>

    <main>
      <div class="grid" id="data-container">
        <!-- cards akan di-render oleh script.js -->
      </div>

      <p class="footer-note">
        Data harga pangan: © Pemerintah Provinsi Jawa Barat<br>
        <a style="color:#0a84ff;text-decoration:none;">data.jabarprov.go.id</a>
      </p>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>

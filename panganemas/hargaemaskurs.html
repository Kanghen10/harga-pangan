<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard Harga Emas & Kurs Mata Uang</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>📊 Dashboard Harga Emas & Kurs Mata Uang</h1>
  </header>

  <main>
    <section class="cards">
      <div class="card gold">
        <h2>Harga Emas</h2>
        <p class="value" id="harga-emas">Loading...</p>
      </div>

      <div class="card usd">
        <h2>Kurs Dolar AS</h2>
        <p class="value" id="kurs-usd">Loading...</p>
      </div>
    </section>

    <section class="kurs-section">
      <h2>Kurs Mata Uang Lain (ke Rupiah)</h2>
      <table>
        <thead>
          <tr>
            <th>Mata Uang</th>
            <th>Kurs (Rp)</th>
          </tr>
        </thead>
        <tbody id="kurs-table-body">
          <!-- Akan diisi otomatis oleh script.js -->
        </tbody>
      </table>
    </section>
  </main>

  <footer>  
    <p><strong>Sumber:</strong> kursdollar.org dan harga-emas.net</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>

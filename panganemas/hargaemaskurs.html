<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harga Emas & Kurs Mata Uang</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Harga Emas & Kurs Mata Uang</h1>
    <p id="update-info">Memuat data…</p>
  </header>

  <section class="cards">
    <div class="card card-gold">
      <h2>Harga Emas / gram</h2>
      <p class="value" id="harga-emas">-</p>
    </div>

    <div class="card card-usd">
      <h2>Kurs USD → Rupiah</h2>
      <p class="value" id="kurs-usd">-</p>
    </div>
  </section>

  <section class="table-section">
    <h2>Kurs Mata Uang Lain (ke Rupiah)</h2>
    <table id="kurs-lain">
      <thead>
        <tr><th>Mata Uang</th><th>Kurs (Rp)</th></tr>
      </thead>
      <tbody>
        <!-- Baris akan di-isi via JS -->
      </tbody>
    </table>
  </section>

  <script src="script.js"></script>
</body>
</html>

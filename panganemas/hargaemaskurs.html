<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Harga Emas & Kurs Dunia</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>📊 Harga Emas & Kurs Dunia</h1>
    <p id="update-info">Memuat data...</p>
  </header>

  <section class="cards">
    <div class="card card-gold">
      <h2>Harga Emas per Gram</h2>
      <p class="value" id="harga-emas">-</p>
    </div>

    <div class="card card-usd">
      <h2>Kurs USD → Rupiah</h2>
      <p class="value" id="kurs-usd">-</p>
    </div>
  </section>

  <section class="table-section">
    <h2>🌍 Kurs Mata Uang Lain (ke Rupiah)</h2>
    <table id="kurs-lain">
      <thead>
        <tr><th>Mata Uang</th><th>Kurs (Rp)</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <footer>
    <p>Data sumber: <a>harga-emas.net</a> & 
    <a>kursdollar.org</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>

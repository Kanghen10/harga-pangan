<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Harga Emas & Kurs Dollar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Segoe UI", Tahoma, Verdana, sans-serif;
      background: #f7f8fa;
      color: #222;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }
    header h1 {
      font-size: 1.6rem;
      color: #2b3d63;
      margin-bottom: 8px;
    }
    #update-info {
      color: #666;
      font-size: 0.95rem;
    }

    .table-section {
      width: 100%;
      max-width: 600px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    thead {
      background-color: #e3e8ff;
    }
    th, td {
      padding: 14px 18px;
      font-size: 1rem;
    }
    th {
      text-align: left;
      color: #1a2a5c;
      font-weight: 600;
      border-bottom: 2px solid #d4dbf9;
    }
    td:nth-child(1) { color: #333; }
    td:nth-child(2) { text-align: right; font-weight: bold; color: #123e8a; }

    tbody tr:nth-child(odd) { background-color: #f9faff; }
    tbody tr:nth-child(even) { background-color: #eef2ff; }
    tbody tr:hover { background-color: #dbe3ff; transition: background 0.2s ease; }

    footer { text-align: center; margin-top: 40px; color: #777; font-size: 0.9rem; }
  </style>
</head>
<body>

  <header>
    <h1>Harga Emas & Kurs Dollar Amerika</h1>
    <p id="update-info">Memuat data terbaru...</p>
  </header>

  <section class="table-section">
    <table id="tabel-utama">
      <thead>
        <tr>
          <th>Keterangan</th>
          <th>Nilai (Rp)</th>
        </tr>
      </thead>
      <tbody id="tbody-main">
        <tr>
          <td>Harga Emas per Gram</td>
          <td id="harga-emas">-</td>
        </tr>
        <tr>
          <td>Kurs USD → Rupiah</td>
          <td id="kurs-usd">-</td>
        </tr>
      </tbody>

      <thead>
        <tr>
          <th>Mata Uang Lain</th>
          <th>Beli (Rp)</th>
        </tr>
      </thead>
      <tbody id="tbody-kurs">
        <!-- Baris kurs lain diisi otomatis dari JS -->
      </tbody>
    </table>
  </section>

  <footer></footer>

  <script src="script.js"></script>
</body>
</html>

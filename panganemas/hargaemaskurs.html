<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Harga Emas & Kurs Dunia</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>💰 Harga Emas & Kurs Dunia</h1>
    <p class="subtitle" id="mainUpdate">Memuat data...</p>
  </header>

  <main class="layout">
    <section class="card gold">
      <h2>Harga Emas per Gram</h2>
      <div class="value" id="goldPrice">—</div>
      <div class="meta" id="goldUpdate"></div>
    </section>

    <section class="card usd">
      <h2>Kurs Dollar Amerika (USD → Rupiah)</h2>
      <div class="value" id="usdPrice">—</div>
      <div class="meta" id="usdUpdate"></div>
    </section>

    <section class="card world wide">
      <h2>Kurs Mata Uang Lain (ke Rupiah)</h2>
      <div class="grid" id="ratesGrid">
        <!-- akan diisi oleh script.js -->
      </div>
    </section>
  </main>

  <footer>
    Sumber : kursdollar.org dan harga-emas.net
  </footer>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cek Tarif Tol Indonesia</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

select, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: 1px solid #ddd;
  font-size: 16px;
}

button {
  background: #0066ff;
  color: white;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #0053cc;
}

#output {
  background: #eef3ff;
  margin-top: 20px;
  padding: 15px;
  border-radius: 10px;
  display: none;
}
</style>

</head>
<body>

<div class="container">
  <h2>Cek Tarif Tol Indonesia</h2>

  <select id="toltrans"></select>
  <select id="ruas"></select>
  <select id="asal"></select>
  <select id="tujuan"></select>

  <button onclick="cekTarif()">Cek Tarif</button>

  <div id="output"></div>
</div>

<script src="tariftol.js"></script>

</body>
</html>
